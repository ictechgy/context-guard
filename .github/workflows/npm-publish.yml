                  document = json.loads(package_json.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit("candidate package.json is invalid") from error
              return document

          root = Path(os.environ["RUNNER_TEMP"]) / "candidate"
          allowed_metadata = {"candidate-manifest.json", "candidate-sha256sums.txt"}
          candidates = []
          try:
