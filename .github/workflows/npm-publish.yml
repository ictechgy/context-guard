          filename = record.get("filename")
          if not isinstance(filename, str) or filename != tarball.name:
              raise SystemExit("candidate filename is unsafe")
          declared_size = record.get("size_bytes")
          if isinstance(declared_size, bool) or not isinstance(declared_size, int) or not 0 < declared_size <= MAX_CANDIDATE_BYTES:
              raise SystemExit("candidate size is invalid")
