                                  raise SystemExit("candidate package.json exceeds the audit limit")
                              stream = archive.extractfile(member)
                              if stream is None:
                                  raise SystemExit("candidate package.json is unreadable")
                              package_json = stream.read(MAX_PACKAGE_JSON_BYTES + 1)
                              package_json_size = member.size
              except (OSError, tarfile.TarError) as error:
                  raise SystemExit("candidate tarball is invalid") from error
              if package_json is None or len(package_json) != package_json_size:
                  raise SystemExit("candidate package.json is missing or truncated")
