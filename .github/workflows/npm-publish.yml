          except OSError as error:
              raise SystemExit("candidate artifact is unavailable") from error
          candidate_names = {path.name for path in candidates}
          tarballs = [path for path in candidates if path.name not in allowed_metadata]
          if len(candidates) != 3 or len(candidate_names) != 3 or len(tarballs) != 1:
              raise SystemExit("candidate artifact contains unexpected files")
          tarball = tarballs[0]
          if Path(tarball.name).name != tarball.name or not tarball.name.endswith(".tgz"):
              raise SystemExit("candidate filename is unsafe")
          manifest_bytes = read_bounded_regular(
              root / "candidate-manifest.json", MAX_CANDIDATE_MANIFEST_BYTES
          )
          checksum_bytes = read_bounded_regular(
              root / "candidate-sha256sums.txt", MAX_CHECKSUM_BYTES
          )
          tarball_bytes = read_bounded_regular(tarball, MAX_CANDIDATE_BYTES)
          try:
              manifest = json.loads(manifest_bytes.decode("ascii"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit("candidate manifest is invalid") from error
          packages = manifest.get("packages") if isinstance(manifest, dict) else None
          if not isinstance(packages, list) or len(packages) != 2:
              raise SystemExit("candidate package set is invalid")
          checksum_rows = []
          for package_record in packages:
              if not isinstance(package_record, dict):
                  raise SystemExit("candidate package record is invalid")
              package_filename = package_record.get("filename")
              package_sha256 = package_record.get("sha256")
              if (
                  not isinstance(package_filename, str)
                  or Path(package_filename).name != package_filename
                  or re.fullmatch(r"[0-9a-f]{64}", str(package_sha256)) is None
              ):
                  raise SystemExit("candidate checksum record is invalid")
