name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish to the next dist-tag"
        required: true
        type: choice
        options:
          - receipt
          - root
      candidate_run_id:
        description: "GitHub Actions run ID that produced the candidate"
        required: true
        type: string
      candidate_artifact_id:
        description: "Immutable GitHub artifact ID containing the candidate"
        required: true
        type: string
      candidate_commit_sha:
        description: "Exact 40-character source commit bound by the candidate manifest"
        required: true
        type: string
      expected_sha256:
        description: "Reviewed SHA-256 of the exact npm tarball"
        required: true
        type: string
      version:
        description: "Exact package version inside the candidate"
        required: true
        type: string
      receipt_version:
        description: "Exact Receipt dependency version; for Receipt publication use the same version"
        required: true
        type: string
      confirm_publish:
        description: "Confirm publication of this exact candidate to next"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.inputs.package }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  publish-receipt:
    if: ${{ github.event.inputs.package == 'receipt' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-receipt-next
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      CANDIDATE_COMMIT_SHA: ${{ github.event.inputs.candidate_commit_sha }}
      CANDIDATE_RUN_ID: ${{ github.event.inputs.candidate_run_id }}
      EXPECTED_PACKAGE: "@ictechgy/context-guard-receipt"
      EXPECTED_RECEIPT_VERSION: ${{ github.event.inputs.receipt_version }}
      EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 }}
      EXPECTED_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Refuse an unconfirmed publication request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_publish }}" != "true" ]; then
            echo "::error::publication requires confirm_publish=true"
            exit 1
          fi
          test "$EXPECTED_VERSION" = "$EXPECTED_RECEIPT_VERSION"

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download immutable Receipt candidate asset
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ github.event.inputs.candidate_artifact_id }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Verify candidate manifest GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$RUNNER_TEMP/candidate/candidate-manifest.json"
          --repo ictechgy/context-guard
          --source-digest "$CANDIDATE_COMMIT_SHA"
          --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          --signer-digest "$CANDIDATE_COMMIT_SHA"
          --deny-self-hosted-runners

      - name: Verify Receipt candidate manifest and digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import tarfile
          from pathlib import Path

          MAX_CANDIDATE_BYTES = 50 * 1024 * 1024
          MAX_CANDIDATE_MANIFEST_BYTES = 256 * 1024
          MAX_CHECKSUM_BYTES = 8 * 1024
          MAX_PACKAGE_JSON_BYTES = 512 * 1024
          MAX_TAR_MEMBERS = 4096
          MAX_TAR_DECLARED_BYTES = 128 * 1024 * 1024
          MAX_TAR_STREAM_BYTES = 128 * 1024 * 1024
          MAX_TAR_STREAM_READ_BYTES = 64 * 1024

          def file_identity(metadata):
              return (
                  metadata.st_dev, metadata.st_ino, metadata.st_mode,
                  metadata.st_nlink, metadata.st_uid, metadata.st_gid,
                  metadata.st_size, metadata.st_mtime_ns, metadata.st_ctime_ns,
              )

          def read_bounded_regular(path, maximum):
              try:
                  before = path.lstat()
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_nlink != 1
                      or stat.S_IMODE(before.st_mode) & 0o022
                      or before.st_size < 1
                      or before.st_size > maximum
                  ):
                      raise SystemExit("candidate artifact contains an unsafe file")
                  flags = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW
                  descriptor = os.open(path, flags)
                  try:
                      opened = os.fstat(descriptor)
                      if file_identity(before) != file_identity(opened):
                          raise SystemExit("candidate artifact changed before read")
                      chunks = []
                      total = 0
                      while total <= maximum:
                          chunk = os.read(descriptor, min(65536, maximum + 1 - total))
                          if not chunk:
                              break
                          chunks.append(chunk)
                          total += len(chunk)
                      after = os.fstat(descriptor)
                  finally:
                      os.close(descriptor)
              except OSError as error:
                  raise SystemExit("candidate artifact is unreadable") from error
              content = b"".join(chunks)
              if (
                  file_identity(opened) != file_identity(after)
                  or len(content) != opened.st_size
                  or len(content) > maximum
              ):
                  raise SystemExit("candidate artifact changed during read")
              return content

          class BoundedDecompressedReader:
              def __init__(self, source, maximum):
                  self.source = source
                  self.maximum = maximum
                  self.total = 0

              def read(self, size=-1):
                  requested = MAX_TAR_STREAM_READ_BYTES if size < 0 else min(
                      size, MAX_TAR_STREAM_READ_BYTES
                  )
                  if requested == 0:
                      return b""
                  remaining = self.maximum - self.total
                  chunk = self.source.read(min(max(requested, 1), remaining + 1))
                  if not isinstance(chunk, bytes):
                      raise SystemExit("candidate decompressed stream is invalid")
                  self.total += len(chunk)
                  if self.total > self.maximum:
                      raise SystemExit("candidate tarball exceeds the decompressed stream limit")
                  return chunk

          def package_document(tarball_bytes):
              package_json = None
              package_json_size = None
              member_count = 0
              declared_bytes = 0
              try:
                  compressed = io.BytesIO(tarball_bytes)
                  with gzip.GzipFile(fileobj=compressed, mode="rb") as decompressed:
                      bounded = BoundedDecompressedReader(
                          decompressed, MAX_TAR_STREAM_BYTES
                      )
                      with tarfile.open(fileobj=bounded, mode="r|") as archive:
                          for member in archive:
                              member_count += 1
                              if member_count > MAX_TAR_MEMBERS:
                                  raise SystemExit("candidate tarball exceeds the member limit")
                              if member.size < 0:
                                  raise SystemExit("candidate tarball member size is invalid")
                              declared_bytes += member.size
                              if declared_bytes > MAX_TAR_DECLARED_BYTES:
                                  raise SystemExit("candidate tarball expands beyond the audit limit")
                              if member.name != "package/package.json":
                                  continue
                              if package_json is not None or not member.isreg():
                                  raise SystemExit("candidate package.json is ambiguous")
                              if not 0 < member.size <= MAX_PACKAGE_JSON_BYTES:
                                  raise SystemExit("candidate package.json exceeds the audit limit")
                              stream = archive.extractfile(member)
                              if stream is None:
                                  raise SystemExit("candidate package.json is unreadable")
                              package_json = stream.read(MAX_PACKAGE_JSON_BYTES + 1)
                              package_json_size = member.size
              except (OSError, tarfile.TarError) as error:
                  raise SystemExit("candidate tarball is invalid") from error
              if package_json is None or len(package_json) != package_json_size:
                  raise SystemExit("candidate package.json is missing or truncated")
              try:
                  document = json.loads(package_json.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  raise SystemExit("candidate package.json is invalid") from error
              return document

          root = Path(os.environ["RUNNER_TEMP"]) / "candidate"
          allowed_metadata = {"candidate-manifest.json", "candidate-sha256sums.txt"}
          candidates = []
          try:
              for candidate in root.iterdir():
                  candidates.append(candidate)
                  if len(candidates) > 3:
                      raise SystemExit("candidate artifact contains unexpected files")
          except OSError as error:
              raise SystemExit("candidate artifact is unavailable") from error
          candidate_names = {path.name for path in candidates}
          tarballs = [path for path in candidates if path.name not in allowed_metadata]
          if len(candidates) != 3 or len(candidate_names) != 3 or len(tarballs) != 1:
              raise SystemExit("candidate artifact contains unexpected files")
          tarball = tarballs[0]
          if Path(tarball.name).name != tarball.name or not tarball.name.endswith(".tgz"):
              raise SystemExit("candidate filename is unsafe")
          manifest_bytes = read_bounded_regular(
              root / "candidate-manifest.json", MAX_CANDIDATE_MANIFEST_BYTES
          )
          checksum_bytes = read_bounded_regular(
              root / "candidate-sha256sums.txt", MAX_CHECKSUM_BYTES
          )
          tarball_bytes = read_bounded_regular(tarball, MAX_CANDIDATE_BYTES)
          try:
              manifest = json.loads(manifest_bytes.decode("ascii"))
          except (UnicodeDecodeError, json.JSONDecodeError) as error:
              raise SystemExit("candidate manifest is invalid") from error
          packages = manifest.get("packages") if isinstance(manifest, dict) else None
          if not isinstance(packages, list) or len(packages) != 2:
              raise SystemExit("candidate package set is invalid")
          checksum_rows = []
          for package_record in packages:
              if not isinstance(package_record, dict):
                  raise SystemExit("candidate package record is invalid")
              package_filename = package_record.get("filename")
              package_sha256 = package_record.get("sha256")
              if (
                  not isinstance(package_filename, str)
                  or Path(package_filename).name != package_filename
                  or re.fullmatch(r"[0-9a-f]{64}", str(package_sha256)) is None
              ):
                  raise SystemExit("candidate checksum record is invalid")
              checksum_rows.append(f"{package_sha256}  {package_filename}\n")
          if checksum_bytes != "".join(checksum_rows).encode("ascii"):
              raise SystemExit("candidate checksum document is invalid")
          if manifest.get("repository") != "ictechgy/context-guard" or manifest.get("commit_sha") != os.environ["CANDIDATE_COMMIT_SHA"]:
              raise SystemExit("candidate source identity mismatch")
          if re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE_COMMIT_SHA"]) is None:
              raise SystemExit("candidate commit is invalid")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["EXPECTED_SHA256"]) is None:
              raise SystemExit("expected candidate digest is invalid")
          matches = [item for item in manifest.get("packages", []) if item.get("name") == os.environ["EXPECTED_PACKAGE"]]
          if len(matches) != 1:
              raise SystemExit("candidate package record is missing or ambiguous")
          record = matches[0]
          filename = record.get("filename")
          if not isinstance(filename, str) or filename != tarball.name:
              raise SystemExit("candidate filename is unsafe")
          declared_size = record.get("size_bytes")
          if isinstance(declared_size, bool) or not isinstance(declared_size, int) or not 0 < declared_size <= MAX_CANDIDATE_BYTES:
              raise SystemExit("candidate size is invalid")
          if len(tarball_bytes) != declared_size:
              raise SystemExit("candidate size binding mismatch")
          digest = hashlib.sha256(tarball_bytes).hexdigest()
          if digest != os.environ["EXPECTED_SHA256"] or digest != record.get("sha256") or record.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("candidate package binding mismatch")
          integrity = "sha512-" + base64.b64encode(hashlib.sha512(tarball_bytes).digest()).decode("ascii")
          if integrity != record.get("integrity"):
              raise SystemExit("candidate package integrity mismatch")
          if re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("receipt_package_files_sha256", ""))) is None:
              raise SystemExit("candidate Receipt package-files binding is invalid")
          package = package_document(tarball_bytes)
          if not isinstance(package, dict) or package.get("name") != os.environ["EXPECTED_PACKAGE"] or package.get("version") != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("candidate package identity mismatch")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"CANDIDATE_TARBALL={tarball}\n")
          PY

      - name: Verify Receipt GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$CANDIDATE_TARBALL"
          --repo ictechgy/context-guard
          --source-digest "$CANDIDATE_COMMIT_SHA"
          --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          --signer-digest "$CANDIDATE_COMMIT_SHA"
          --deny-self-hosted-runners

      - name: Preview exact Receipt candidate
        run: npm publish "$CANDIDATE_TARBALL" --dry-run --access public --tag next

      - name: Publish exact Receipt candidate with trusted publishing
        run: npm publish "$CANDIDATE_TARBALL" --access public --tag next

  publish-root:
    needs: publish-receipt
    if: ${{ always() && github.event.inputs.package == 'root' && needs.publish-receipt.result == 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-root-next
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    env:
      CANDIDATE_COMMIT_SHA: ${{ github.event.inputs.candidate_commit_sha }}
      CANDIDATE_RUN_ID: ${{ github.event.inputs.candidate_run_id }}
      EXPECTED_PACKAGE: "@ictechgy/context-guard"
      EXPECTED_RECEIPT_VERSION: ${{ github.event.inputs.receipt_version }}
      EXPECTED_SHA256: ${{ github.event.inputs.expected_sha256 }}
      EXPECTED_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Refuse an unconfirmed publication request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_publish }}" != "true" ]; then
            echo "::error::publication requires confirm_publish=true"
            exit 1
          fi

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download immutable root candidate asset
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ github.event.inputs.candidate_artifact_id }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Verify candidate manifest GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$RUNNER_TEMP/candidate/candidate-manifest.json"
          --repo ictechgy/context-guard
          --source-digest "$CANDIDATE_COMMIT_SHA"
          --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          --signer-digest "$CANDIDATE_COMMIT_SHA"
          --deny-self-hosted-runners

      - name: Verify root candidate manifest, dependency, and digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import tarfile
          from pathlib import Path

