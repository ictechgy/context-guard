          if integrity != record.get("integrity"):
              raise SystemExit("candidate package integrity mismatch")
          package = package_document(tarball_bytes)
          dependencies = package.get("dependencies") if isinstance(package, dict) else None
          if (
              not isinstance(package, dict)
              or package.get("name") != os.environ["EXPECTED_PACKAGE"]
              or package.get("version") != os.environ["EXPECTED_VERSION"]
              or not isinstance(dependencies, dict)
              or dependencies.get("@ictechgy/context-guard-receipt") != os.environ["EXPECTED_RECEIPT_VERSION"]
          ):
              raise SystemExit("candidate root package identity or exact dependency mismatch")
          receipt_matches = [
              item for item in manifest.get("packages", [])
              if isinstance(item, dict)
              and item.get("name") == "@ictechgy/context-guard-receipt"
          ]
          if len(receipt_matches) != 1:
              raise SystemExit("candidate Receipt record is missing or ambiguous")
          receipt_record = receipt_matches[0]
          receipt_integrity = receipt_record.get("integrity")
          if (
              receipt_record.get("version") != os.environ["EXPECTED_RECEIPT_VERSION"]
              or re.fullmatch(r"sha512-[A-Za-z0-9+/]{86}==", str(receipt_integrity)) is None
              or manifest.get("exact_dependency") != {
                  "name": "@ictechgy/context-guard-receipt",
                  "version": os.environ["EXPECTED_RECEIPT_VERSION"],
              }
              or re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("receipt_package_files_sha256", ""))) is None
          ):
              raise SystemExit("candidate Receipt exact-asset binding mismatch")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"CANDIDATE_TARBALL={tarball}\n")
              output.write(f"EXPECTED_RECEIPT_INTEGRITY={receipt_integrity}\n")
          PY

      - name: Verify exact published Receipt bytes
        shell: bash
        run: |
          set -euo pipefail
          observed="$(npm view "@ictechgy/context-guard-receipt@$EXPECTED_RECEIPT_VERSION" dist.integrity --json)"
          test "$observed" = "\"$EXPECTED_RECEIPT_INTEGRITY\""

      - name: Verify root GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$CANDIDATE_TARBALL"
          --repo ictechgy/context-guard
          --source-digest "$CANDIDATE_COMMIT_SHA"
          --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          --signer-digest "$CANDIDATE_COMMIT_SHA"
          --deny-self-hosted-runners

      - name: Preview exact root candidate
        run: npm publish "$CANDIDATE_TARBALL" --dry-run --access public --tag next

      - name: Publish exact root candidate with trusted publishing
        run: npm publish "$CANDIDATE_TARBALL" --access public --tag next
