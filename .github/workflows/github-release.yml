name: Publish GitHub release from immutable candidates

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact bare semver"
        required: true
        type: string
      release_commit_sha:
        description: "Exact 40-character candidate source commit"
        required: true
        type: string
      candidate_run_id:
        description: "Run that built and attested both npm candidates"
        required: true
        type: string
      candidate_artifact_ids:
        description: "Comma-separated immutable Receipt and root artifact IDs"
        required: true
        type: string
      confirm_release:
        description: "Confirm publishing this exact release"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-release-v${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    environment: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Preflight release credential and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.inputs.release_commit_sha }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          test "${{ github.event.inputs.confirm_release }}" = true || { echo "::error::confirm_release=true is required"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "::error::version must be bare semver"; exit 1; }
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_commit_sha must be an exact lowercase commit"; exit 1; }
          [[ "${{ github.event.inputs.candidate_run_id }}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::candidate_run_id must be numeric"; exit 1; }
          [[ "${{ github.event.inputs.candidate_artifact_ids }}" =~ ^[1-9][0-9]*,[1-9][0-9]*$ ]] || { echo "::error::candidate_artifact_ids must contain exactly two numeric IDs"; exit 1; }
          gh auth status
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" --jq '.sha' | grep -Fx "$RELEASE_COMMIT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::release tag already exists"; exit 1; fi
      - name: Download exact build-once candidate assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          run-id: ${{ github.event.inputs.candidate_run_id }}
          artifact-ids: ${{ github.event.inputs.candidate_artifact_ids }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify candidate provenance and source binding
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.event.inputs.release_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/release-assets/candidate-manifest.json"
          test -f "$manifest"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="ascii"))["commit_sha"])' "$manifest")" = "$CANDIDATE_COMMIT"
          gh attestation verify "$manifest" --repo ictechgy/context-guard --source-digest "$CANDIDATE_COMMIT" --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          for asset in "$RUNNER_TEMP"/release-assets/*.tgz; do
            test -f "$asset"
            gh attestation verify "$asset" --repo ictechgy/context-guard --source-digest "$CANDIDATE_COMMIT" --signer-workflow ictechgy/context-guard/.github/workflows/npm-candidate.yml
          done
      - name: Publish GitHub release without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.inputs.release_commit_sha }}
          VERSION: ${{ github.event.inputs.version }}
        run: >-
          gh release create "v$VERSION"
          "$RUNNER_TEMP"/release-assets/*.tgz
          "$RUNNER_TEMP"/release-assets/candidate-manifest.json
          "$RUNNER_TEMP"/release-assets/candidate-sha256sums.txt
          --target "$RELEASE_COMMIT"
          --generate-notes
