name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-prepublish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Normalize hosted runtime permissions
        shell: bash
        run: |
          set -euo pipefail
          python_runtime="$(python -I -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve(strict=True))')"
          node_runtime="$(python -I -c 'from pathlib import Path; import shutil; node = shutil.which("node"); assert node is not None; print(Path(node).resolve(strict=True))')"
          case "${RUNNER_OS}:${python_runtime}" in
            Linux:/opt/hostedtoolcache/*) ;;
            *) echo "unexpected hosted Python runtime" >&2; exit 1 ;;
          esac
          case "${RUNNER_OS}:${node_runtime}" in
            Linux:/opt/hostedtoolcache/*) ;;
            *) echo "unexpected hosted Node runtime" >&2; exit 1 ;;
          esac
          sudo chmod go-w -- "$python_runtime" "$node_runtime"

      - name: Verify hosted runtime trust
        run: >-
          python -m unittest -v
          tests.test_bash_reference_v1.BashReferenceV1Tests.test_github_runner_python_runtime_is_policy_eligible
          tests.test_bash_reference_v1.BashReferenceV1Tests.test_github_runner_node_runtime_is_policy_eligible

      - name: Run prepublish release gate
        timeout-minutes: 18
        run: python scripts/prepublish_check.py

      - name: Run staged plugin release smoke
        timeout-minutes: 5
        run: python scripts/release_smoke.py

  test-and-prepublish-macos:
    name: test-and-prepublish (macos-latest, 3.12)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Normalize hosted runtime permissions
        shell: bash
        run: |
          set -euo pipefail
          python_runtime="$(python -I -c 'from pathlib import Path; import sys; print(Path(sys.executable).resolve(strict=True))')"
          node_runtime="$(python -I -c 'from pathlib import Path; import shutil; node = shutil.which("node"); assert node is not None; print(Path(node).resolve(strict=True))')"
          case "${RUNNER_OS}:${python_runtime}" in
            macOS:/Library/Frameworks/Python.framework/Versions/*) ;;
            *) echo "unexpected hosted Python runtime" >&2; exit 1 ;;
          esac
          case "${RUNNER_OS}:${node_runtime}" in
            macOS:/opt/homebrew/*|macOS:/usr/local/*|macOS:/Users/runner/hostedtoolcache/*) ;;
            *) echo "unexpected hosted Node runtime" >&2; exit 1 ;;
          esac
          sudo chmod go-w -- "$python_runtime" "$node_runtime"

      - name: Verify hosted runtime trust
        run: >-
          python -m unittest -v
          tests.test_bash_reference_v1.BashReferenceV1Tests.test_github_runner_python_runtime_is_policy_eligible
          tests.test_bash_reference_v1.BashReferenceV1Tests.test_github_runner_node_runtime_is_policy_eligible

      - name: Run prepublish release gate
        timeout-minutes: 25
        run: python scripts/prepublish_check.py

      - name: Run staged plugin release smoke
        timeout-minutes: 8
        run: python scripts/release_smoke.py

      - name: Run ContextGuard Mac Swift tests
        timeout-minutes: 15
        working-directory: apps/contextguard-mac
        run: swift test
